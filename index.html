<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sumi">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>Sumi</title>
<style>
:root{
  --bg:#f6f5f2;--card:#fff;--ink:#1b1b1b;--muted:#77736c;--line:#e6e3dd;
  --accent:#1b1b1b;--accent-ink:#fff;--good:#2f7d4f;--ok:#a8741a;--bad:#b23a3a;--soft:#efede8;
  --r:16px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121212;--card:#1c1c1c;--ink:#f1efea;--muted:#9a968e;--line:#2c2c2c;
  --accent:#f1efea;--accent-ink:#121212;--good:#5fbf86;--ok:#d9a646;--bad:#e06b6b;--soft:#242424;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.45 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Helvetica Neue",sans-serif;
  padding:env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom));min-height:100vh}
.jp{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:28px;margin:8px 0 4px;letter-spacing:-.02em}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:24px 0 8px;font-weight:600}
.sub{color:var(--muted);font-size:14px;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.btn{display:block;width:100%;padding:15px 16px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:17px}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn:disabled{opacity:.4}
.btn.sm{display:inline-block;width:auto;padding:9px 14px;font-size:15px}
.stack>*+*{margin-top:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:var(--soft);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px}
.stat span{font-size:12px;color:var(--muted)}
.pack{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.pack:last-child{border-bottom:0}
.bar{height:4px;background:var(--soft);border-radius:2px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--good)}
.toggle{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;transition:.15s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px #0003}
.toggle.on{background:var(--good)}.toggle.on::after{left:21px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;padding:12px 0 10px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button.on{color:var(--ink);font-weight:600}
nav .ic{font-size:20px;line-height:1}
.mission li{margin:6px 0}
.mission label{display:flex;gap:10px;align-items:flex-start}
.mission input{width:20px;height:20px;margin-top:2px;accent-color:var(--good)}

/* session */
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.top .bar{flex:1;margin:0;height:6px}
.x{font-size:22px;color:var(--muted);padding:4px 8px}
.tag{display:inline-block;font-size:12px;color:var(--muted);background:var(--soft);padding:3px 9px;border-radius:99px}
.prompt{font-size:24px;font-weight:600;margin:14px 0 4px;line-height:1.3}
.big-jp{font-size:30px;font-weight:600;margin:6px 0 2px;line-height:1.35}
.kana{font-size:18px;color:var(--ink);margin:2px 0;word-spacing:.25em}
.romaji{font-size:15px;color:var(--muted);margin:2px 0}
.hint{background:var(--soft);border-radius:12px;padding:12px 14px;margin-top:12px;font-size:18px}
.hint small{display:block;color:var(--muted);font-size:12px;margin-bottom:2px}
.play{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--soft);border-radius:99px;padding:10px 16px;font-weight:600}
.play.huge{width:96px;height:96px;font-size:34px;padding:0;margin:20px auto;display:flex;background:var(--accent);color:var(--accent-ink)}
.opts{display:grid;gap:8px;margin-top:14px}
.opt{text-align:left;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:16px}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--card))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--card))}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.grade button{padding:14px 6px;border-radius:12px;font-weight:600;font-size:15px;background:var(--soft)}
.grade .g0{color:var(--bad)}.grade .g1{color:var(--ok)}.grade .g2{color:var(--good)}
.verdict{font-weight:700;margin-top:14px}
.verdict.good{color:var(--good)}.verdict.bad{color:var(--bad)}
.reply{border-left:3px solid var(--good);padding:6px 0 6px 12px;margin-top:14px}
.reply small{color:var(--muted);font-size:12px;display:block}
.note{font-size:13px;color:var(--muted);margin-top:10px}
input[type=text],textarea,select{width:100%;font:inherit;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
label.f{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px}
.seg button{flex:1;padding:9px;border-radius:10px;font-size:14px}
.seg button.on{background:var(--card);font-weight:600;box-shadow:0 1px 2px #0002}
.phrase{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.phrase:last-child{border-bottom:0}
.phrase .t{flex:1;min-width:0}
.phrase .en{font-size:14px;color:var(--muted)}
.phrase .ja{font-size:18px}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--line)}
.dot.l1{background:var(--ok)}.dot.l2{background:var(--good)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:7px 12px;border-radius:99px;background:var(--soft);font-size:14px}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.del{color:var(--bad);font-size:13px}
.center{text-align:center}
.miss li{margin:4px 0}
.hidden{display:none!important}
.ktile.sel{border:2px solid var(--good);background:color-mix(in srgb,var(--good) 10%,var(--card))}
.ktile.sel::after{content:"✓";position:absolute;top:3px;left:6px;font-size:11px;color:var(--good);font-weight:700}
.optk{font-size:40px;text-align:center;padding:14px 0}
.opts.two{grid-template-columns:1fr 1fr}
.sec{font-size:13px;color:var(--muted);margin:16px 0 8px;font-weight:600}
nav button{font-size:11px}
.chipline{line-height:2.1}
.w{display:inline-block;padding:0 3px;margin:0 1px;border-radius:6px;border-bottom:2px dotted var(--line);cursor:pointer}
.w:active{background:var(--soft)}
.nw{white-space:nowrap}
.sheet-bg{position:fixed;inset:0;background:#0006;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:520px;max-height:82vh;overflow:auto;border-radius:20px 20px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom))}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet .big{font-size:44px;font-weight:700;line-height:1.2}
.tabs{display:flex;gap:6px;margin:12px 0;overflow-x:auto}
.tabs button{padding:8px 12px;border-radius:99px;background:var(--soft);font-size:14px;white-space:nowrap}
.tabs button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.kv{display:grid;grid-template-columns:90px 1fr;gap:6px 10px;font-size:15px}
.kv b{color:var(--muted);font-weight:500}
.kgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.ktile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 4px 8px;text-align:center;position:relative}
.ktile .kc{font-size:28px;line-height:1.1}
.ktile .km{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ktile .dot{position:absolute;top:6px;right:6px;width:6px;height:6px}
.bigk{font-size:96px;font-weight:600;text-align:center;line-height:1.15;margin:10px 0}
.hl{color:var(--good);font-weight:700}
input[type=search]{width:100%;font:inherit;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav">
  <button data-tab="home" class="on"><span class="ic">墨</span>Practice</button>
  <button data-tab="kanji"><span class="ic">字</span>Kanji</button>
  <button data-tab="book"><span class="ic">📖</span>Library</button>
  <button data-tab="add"><span class="ic">＋</span>Add</button>
  <button data-tab="settings"><span class="ic">⚙︎</span>Settings</button>
</nav>
<script src="cards.js"></script>
<script src="lex.js"></script>
<script src="kanji.js"></script>
<script>
"use strict";
// ───────── storage ─────────
const KEY = "sumi.v1";
const DAY = 864e5;
function load(){
  try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s) return s; }catch(e){}
  return null;
}
let S = load() || {
  p:{}, mine:[], log:{}, recent:[], mission:{date:"",ids:[],done:[]},
  set:{rate:0.9, romaji:true, kanji:true, voice:"", packs:{}, perSession:15}
};
S.set.packs = S.set.packs || {};
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

// packs: insert vocab + kanji before "mine"
delete PACKS.mine; PACKS.vocab="Words (vocab)"; PACKS.kanji="Kanji (N5)"; PACKS.mine="My cards";
const VOCAB = (()=>{ const seen=new Set(), out=[];
  Object.values(LEX).filter(x=>x.t==="w").forEach(x=>{ if(seen.has(x.w+"|"+x.en)) return; seen.add(x.w+"|"+x.en);
    out.push({id:"v:"+x.k, pack:"vocab", kind:"say", en:x.en, ja:x.w, kana:x.k, lex:x.k}); });
  return out; })();
const KCARDS = KANJI.map(x=>({id:"k:"+x.k, pack:"kanji", kind:"kanji", en:x.m, ja:x.k, kana:x.ex[0].kana, kj:x.k, group:x.tag}));
const allCards = () => CARDS.concat(VOCAB, KCARDS, S.mine);
const PHRASES = () => CARDS.concat(S.mine);

// split a sentence into word chunks using the spaced kana + lexicon
function segment(ja, kana){
  let rest=ja.replace(/\s/g,""); const out=[];
  for(const tok of kana.replace(/([、。？！])/g,"$1 ").trim().split(/\s+/)){
    const m=tok.match(/^(.*?)([、。？！]*)$/), k=m[1], p=m[2];
    if(k){
      const lx=LEX[k]; let t=null;
      if(lx && rest.startsWith(lx.w)) t=lx.w; else if(rest.startsWith(k)) t=k; else return null;
      rest=rest.slice(t.length); out.push({t, k});
    }
    for(const ch of p){ if(rest[0]===ch) rest=rest.slice(1); out.push({t:ch, p:1}); }
  }
  return rest.length ? null : out;
}
function chips(ja, kana){
  const seg = kana ? segment(ja,kana) : null;
  if(!seg) return esc(S.set.kanji?ja:toHira(kana||ja));
  const parts=[];
  seg.forEach(x=>{ if(x.p && parts.length) parts[parts.length-1]+=esc(x.t);
    else parts.push(x.p?esc(x.t):`<span class="w" data-w="${esc(x.k)}">${esc(S.set.kanji?x.t:toHira(x.k))}</span>`); });
  return parts.map(h=>`<span class="nw">${h}</span>`).join("");
}
const byId = id => allCards().find(c => c.id === id);
const packOn = p => S.set.packs[p] !== false;
const prog = id => S.p[id] || (S.p[id] = {box:0,due:0,seen:0,right:0,wrong:0});

// day boundary at 4am local
function dayKey(t=Date.now()){ const d=new Date(t-4*3600e3); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
function startOfNextDay(n=1){ const d=new Date(Date.now()-4*3600e3); d.setHours(4,0,0,0); return d.getTime()+n*DAY; }
const INTERVAL = [1,1,3,7,14,30]; // days, indexed by box

// ───────── romaji ─────────
const R = {あ:"a",い:"i",う:"u",え:"e",お:"o",か:"ka",き:"ki",く:"ku",け:"ke",こ:"ko",さ:"sa",し:"shi",す:"su",せ:"se",そ:"so",
た:"ta",ち:"chi",つ:"tsu",て:"te",と:"to",な:"na",に:"ni",ぬ:"nu",ね:"ne",の:"no",は:"ha",ひ:"hi",ふ:"fu",へ:"he",ほ:"ho",
ま:"ma",み:"mi",む:"mu",め:"me",も:"mo",や:"ya",ゆ:"yu",よ:"yo",ら:"ra",り:"ri",る:"ru",れ:"re",ろ:"ro",わ:"wa",を:"o",ん:"n",
が:"ga",ぎ:"gi",ぐ:"gu",げ:"ge",ご:"go",ざ:"za",じ:"ji",ず:"zu",ぜ:"ze",ぞ:"zo",だ:"da",ぢ:"ji",づ:"zu",で:"de",ど:"do",
ば:"ba",び:"bi",ぶ:"bu",べ:"be",ぼ:"bo",ぱ:"pa",ぴ:"pi",ぷ:"pu",ぺ:"pe",ぽ:"po",ぁ:"a",ぃ:"i",ぅ:"u",ぇ:"e",ぉ:"o",ゔ:"vu"};
const Y = {ゃ:"a",ゅ:"u",ょ:"o"};
function toHira(s){ return s.replace(/[ァ-ヶ]/g, c=>String.fromCharCode(c.charCodeAt(0)-0x60)); }
function romaji(kana){
  return toHira(kana).replace(/([、。？！])(?=\S)/g,"$1 ").trim().split(/\s+/).map(w=>{
    const bare=w.replace(/[、。？！]/g,"");
    if(bare==="は") return w.replace("は","wa").replace("？","?").replace("。",".").replace("、",",").replace("！","!"); if(bare==="へ") return "e";
    let out="", i=0;
    while(i<w.length){
      const c=w[i], n=w[i+1];
      if(c==="っ"){ const nx=wordRom(w.slice(i+1)); out += nx.startsWith("ch")?"t":(nx[0]||""); i++; continue; }
      if(c==="ー"){ out += (out.match(/[aeiou](?!.*[aeiou])/)||[""])[0]; i++; continue; }
      if(c==="ん"){ out += (n && /[あいうえおやゆよ]/.test(n)) ? "n'" : "n"; i++; continue; }
      if(n && Y[n] && R[c]){ const b=R[c]; out += (/^(shi|chi|ji)$/.test(b)? b.slice(0,-1) : b.slice(0,-1)+"y") + Y[n]; i+=2; continue; }
      if(R[c]!==undefined){ out+=R[c]; i++; continue; }
      if(c==="、") { out+=","; i++; continue; }
      if(c==="。") { out+="."; i++; continue; }
      if(c==="？") { out+="?"; i++; continue; }
      if(c==="！") { out+="!"; i++; continue; }
      out+=c; i++;
    }
    return out;
  }).join(" ").replace(/ ([.,?!])/g,"$1");
  function wordRom(s){ return romaji(s); }
}

// ───────── speech ─────────
let voice=null;
function pickVoice(){
  const vs = speechSynthesis.getVoices().filter(v=>/^ja/i.test(v.lang));
  voice = vs.find(v=>v.name===S.set.voice) || vs.find(v=>/premium|enhanced/i.test(v.name)) || vs.find(v=>/kyoko|o-ren|otoya/i.test(v.name)) || vs[0] || null;
  return vs;
}
if("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged = ()=>{ pickVoice(); if(tab==="settings" && !session) render(); }; }
function say(text, slow){
  if(!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang="ja-JP"; if(voice) u.voice=voice;
  u.rate = slow ? 0.6 : S.set.rate;
  speechSynthesis.speak(u);
}

// ───────── helpers ─────────
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; };
function jpBlock(c, size="big-jp"){
  return `<div class="${size} jp chipline">${chips(c.ja,c.kana)}</div>
    ${S.set.kanji && c.ja.replace(/[\s]/g,"")!==c.kana.replace(/[\s]/g,"")?`<div class="kana jp">${esc(c.kana)}</div>`:""}
    ${S.set.romaji?`<div class="romaji">${esc(romaji(c.kana))}</div>`:""}`;
}
function accuracy(){ const r=S.recent.slice(-30); return r.length? r.filter(Boolean).length/r.length : null; }
function streak(){
  let n=0; for(let k=0;k<400;k++){ const key=dayKey(Date.now()-k*DAY); if(S.log[key]&&S.log[key].n>0) n++; else if(k>0) break; } return n;
}

// ───────── session building ─────────
function dueCards(){
  const now=Date.now();
  return allCards().filter(c=>packOn(c.pack) && S.p[c.id] && S.p[c.id].seen && S.p[c.id].due<=now)
    .sort((a,b)=>S.p[a.id].due-S.p[b.id].due);
}
function newCards(){
  // round-robin across packs so new material is interleaved
  const by={}; allCards().filter(c=>packOn(c.pack) && !(S.p[c.id]&&S.p[c.id].seen)).forEach(c=>(by[c.pack]=by[c.pack]||[]).push(c));
  const out=[], keys=Object.keys(by); let i=0;
  while(keys.some(k=>by[k].length)){ const k=keys[i++%keys.length]; if(by[k].length) out.push(by[k].shift()); }
  return out;
}
function newBudget(){
  const a=accuracy();
  if(a===null) return 8;
  if(a>0.92) return 10;     // too easy: add more new
  if(a<0.75) return 3;      // too hard: consolidate
  return 6;                 // near the ~85% band
}
function interleave(list){
  // avoid same pack back-to-back where possible
  const out=[], pool=list.slice();
  while(pool.length){
    const last=out[out.length-1];
    let i=pool.findIndex(x=>!last || x.card.pack!==last.card.pack);
    if(i<0) i=0;
    out.push(pool.splice(i,1)[0]);
  }
  return out;
}
function pickDir(c){
  if(c.kind==="hear") return "listen";
  if(c.kind==="kanji"){ const p=S.p[c.id]; return (p && p.box>=2 && Math.random()<0.4) ? "listen" : "kanji"; }
  const p=S.p[c.id];
  // once a "say" card is known, sometimes flip it: recognise it by ear too
  if(p && p.box>=2 && Math.random()<0.35) return "listen";
  return "speak";
}
function buildSession(){
  const cap=S.set.perSession;
  const due=dueCards().slice(0,cap);
  const fresh=newCards().slice(0, Math.max(0, Math.min(newBudget(), cap-due.length)));
  const items=shuffle(due.concat(fresh).map(c=>({card:c, dir:pickDir(c), isNew:!(S.p[c.id]&&S.p[c.id].seen)})));
  return interleave(items);
}

// ───────── grading ─────────
function grade(c, g){ // g: 0 missed, 1 rough, 2 nailed
  const p=prog(c.id);
  p.seen++;
  if(g===0){ p.wrong++; p.box=0; p.due=startOfNextDay(1); }
  else if(g===1){ p.right++; p.box=Math.max(1,Math.min(p.box,2)); p.due=startOfNextDay(1); }
  else { p.right++; p.box=Math.min(p.box+1,5); p.due=startOfNextDay(INTERVAL[p.box]); }
  S.recent.push(g>0?1:0); if(S.recent.length>60) S.recent.shift();
  const k=dayKey(); S.log[k]=S.log[k]||{n:0,r:0}; S.log[k].n++; if(g>0) S.log[k].r++;
  save();
}

// ───────── mission (real-life use) ─────────
function mission(){
  const k=dayKey();
  if(S.mission.date!==k){
    const pool=PHRASES().filter(c=>c.kind==="say" && packOn(c.pack) && S.p[c.id] && S.p[c.id].seen);
    const pick=shuffle(pool.filter(c=>S.p[c.id].box<=2)).concat(shuffle(pool)).filter((c,i,a)=>a.indexOf(c)===i).slice(0,3);
    const base = pick.length? pick : shuffle(CARDS.filter(c=>c.kind==="say" && ["food","survival","konbini","time"].includes(c.pack))).slice(0,3);
    S.mission={date:k, ids:base.map(c=>c.id), done:[]}; save();
  }
  return S.mission;
}

function startSession(extra){
  let items=buildSession();
  if(extra || !items.length){
    // nothing due: practise the weakest cards already seen
    const seen=allCards().filter(c=>packOn(c.pack)&&S.p[c.id]&&S.p[c.id].seen).sort((a,b)=>S.p[a.id].box-S.p[b.id].box);
    items=interleave(shuffle(seen.slice(0,12)).map(c=>({card:c,dir:pickDir(c),isNew:false})));
  }
  if(!items.length) return;
  session={items, i:0, total:items.length, right:0, answered:0, missed:[], requeued:{}, st:null};
  say(""); // unlock iOS speech inside the tap
  render();
}

function options(c){
  const pool=allCards().filter(x=>x.id!==c.id && x.en!==c.en && (c.kind==="kanji")===(x.kind==="kanji"));
  const same=shuffle(pool.filter(x=>c.group && x.group===c.group));
  const pack=shuffle(pool.filter(x=>x.pack===c.pack && !same.includes(x)));
  const rest=shuffle(pool.filter(x=>!same.includes(x)&&!pack.includes(x)));
  const picks=[]; for(const x of same.concat(pack,rest)){ if(picks.length>=3) break; if(!picks.some(p=>p.en===x.en)) picks.push(x); }
  return shuffle(picks.concat(c));
}

function finish(c,g){
  const s=session, it=s.items[s.i];
  const retry = s.requeued[c.id]; // second go in the same session
  grade(c,g);
  s.answered++; if(g>0) s.right++;
  if(g===0){
    if(!s.missed.includes(c.id)) s.missed.push(c.id);
    if(!retry){ // bring it back after a few other cards, flipped direction if it's a say-card
      s.requeued[c.id]=true;
      const pos=Math.min(s.i+5, s.items.length);
      s.items.splice(pos,0,{card:c, dir: c.kind==="kanji" ? "kanji" : c.kind==="say" ? (it.dir==="speak"?"listen":"speak") : "listen", isNew:false, retry:true});
    }
  }
  s.i++; s.st=null; render();
}

function renderDone(){
  const s=session, pct=s.answered?Math.round(s.right/s.answered*100):0;
  let msg = pct>=92 ? "Easy run. Next session adds more new phrases." : pct>=75 ? "Right in the sweet spot." : "Tough set. Next session goes lighter on new stuff.";
  $("#app").innerHTML=`
    <h1>Done</h1>
    <div class="card">
      <div style="font-size:40px;font-weight:700">${pct}%</div>
      <div class="sub">${s.right} of ${s.answered} · ${msg}</div>
    </div>
    ${s.missed.length?`<h2>Coming back tomorrow</h2><div class="card"><ul class="miss" style="padding-left:18px;margin:0">
      ${s.missed.map(id=>{const c=byId(id);return `<li><span class="jp">${esc(c.ja)}</span> <span class="sub">${esc(c.en)}</span></li>`}).join("")}</ul></div>`:""}
    <div style="margin-top:16px" class="stack"><button class="btn" id="home">Back</button></div>`;
  $("#home").onclick=()=>{ session=null; tab="home"; render(); };
}

const KTYPES={m:"Meaning", a:"Reading on its own", c:"Reading in words", r:"Kanji from meaning", b:"Build the word", g:"Guess the compound"};
const CTYPES=new Set(["b","g"]);
const COMP_BY=Object.fromEntries(COMPOUNDS.map(c=>[c.w,c]));
function kLabel(K){ return (K.n5?"N5":"Not N5")+" · "+(K.tag==="sign"?"often on signs":inPhrases().has(K.k)?"in your phrases":"N5 core"); }
let _inPh=null, _inPhN=-1;
function inPhrases(){ if(_inPh && _inPhN===S.mine.length) return _inPh; _inPhN=S.mine.length; _inPh=new Set();
  PHRASES().forEach(c=>[c.ja, c.reply&&c.reply.ja, c.ans&&c.ans.ja].forEach(t=>t&&[...t].forEach(ch=>{ if(KANJI_BY[ch]) _inPh.add(ch); }))); return _inPh; }
function kset(){ S.kset=S.kset||{filter:"phrase", picked:[], types:{m:1,a:1,c:1,r:0,b:1,g:1}, count:20, learnN:5};
  if(S.kset.types.b===undefined){ S.kset.types.b=1; S.kset.types.g=1; } return S.kset; }
function compsFor(keys){ const set=new Set(keys); return COMPOUNDS.filter(c=>[...c.w].every(ch=>set.has(ch))); }
function kq(k){ S.kq=S.kq||{}; return S.kq[k]||(S.kq[k]={m:[0,0],a:[0,0],c:[0,0],r:[0,0]}); }
const kSeen = k => !!(S.p["k:"+k] && S.p["k:"+k].seen);
function kWeak(k){ if(!kSeen(k)) return false; const p=S.p["k:"+k]; if(p.box<=1 && p.wrong>0) return true;
  const q=(S.kq||{})[k]; return !!q && Object.values(q).some(([r,w])=>w>0 && w/(r+w)>=0.34); }
function kFilter(f){
  return KANJI.filter(K=>{ switch(f){
    case "n5": return K.n5; case "extra": return !K.n5; case "sign": return K.tag==="sign";
    case "phrase": return inPhrases().has(K.k); case "learned": return kSeen(K.k); case "weak": return kWeak(K.k);
    case "picked": return kset().picked.includes(K.k); default: return true; } });
}

function kItems(keys, types, count, comps){
  let pairs=[]; keys.forEach(k=>types.filter(t=>!CTYPES.has(t)).forEach(t=>pairs.push({k,t})));
  const cts=types.filter(t=>CTYPES.has(t));
  if(cts.length) (comps||compsFor(keys).map(c=>c.w)).forEach(w=>cts.forEach(t=>pairs.push({k:w,t,comp:1})));
  pairs=shuffle(pairs);
  if(count) pairs=pairs.slice(0,count);
  const out=[], pool=pairs.slice();   // avoid the same kanji twice in a row
  while(pool.length){ const last=out[out.length-1]; let i=pool.findIndex(x=>!last||x.k!==last.k); if(i<0)i=0; out.push(pool.splice(i,1)[0]); }
  return out;
}

function startKQuiz(keys, types, count, comps){

function kOptions(K, t, ex){
  const others=shuffle(KANJI.filter(x=>x.k!==K.k));
  const near=others.filter(x=>x.tag===K.tag||x.n5===K.n5);
  const pickN=(arr,key,n)=>{ const out=[], seen=new Set([key(K)]); for(const x of arr){ const v=key(x); if(!seen.has(v)){ seen.add(v); out.push(x); if(out.length>=n) break; } } return out; };
  if(t==="m"||t==="r") return shuffle(pickN(near.concat(others),x=>x.m,3).map(x=>({id:x.k,label:t==="m"?x.m:x.k})).concat({id:K.k,label:t==="m"?K.m:K.k}));
  if(t==="a"){ const rd=x=>x.on+" / "+x.kun; return shuffle(pickN(near.concat(others),rd,3).map(x=>({id:x.k,label:rd(x)})).concat({id:K.k,label:rd(K)})); }
  // c: reading of a word. distractors: the kanji's other words, then words of similar length
  const right=ex.kana, seen=new Set([right]), opts=[{id:"ok",label:right}];
  const cands=K.ex.filter(e=>e.kana!==right).concat(shuffle(KANJI.flatMap(x=>x.ex)).sort((a,b)=>Math.abs(a.kana.length-right.length)-Math.abs(b.kana.length-right.length)));
  for(const e of cands){ if(opts.length>=4) break; if(!seen.has(e.kana)){ seen.add(e.kana); opts.push({id:"x"+opts.length,label:e.kana}); } }
  return shuffle(opts);
}

function compOptions(C){
  const ks=new Set([...C.w]);
  const share=shuffle(COMPOUNDS.filter(x=>x.w!==C.w && [...x.w].some(ch=>ks.has(ch))));
  const rest=shuffle(COMPOUNDS.filter(x=>x.w!==C.w && !share.includes(x)));
  const out=[], seen=new Set([C.en]);
  for(const x of share.slice(0,2).concat(rest)){ if(out.length>=3) break; if(!seen.has(x.en)){ seen.add(x.en); out.push({id:x.w,label:x.en}); } }
  return shuffle(out.concat({id:C.w,label:C.en}));
}
function buildTiles(C){
  const need=[...C.w], set=new Set(need);
  const total=need.length<=2?6:8;
  const near=shuffle(KANJI.filter(K=>!set.has(K.k) && COMPOUNDS.some(x=>x.w.includes(K.k)))).slice(0,total-need.length);
  return shuffle(need.map((k,i)=>({id:"n"+i,k})).concat(near.map((K,i)=>({id:"d"+i,k:K.k}))));
}

  const wq=$("#wq"); if(wq) wq.oninput=e=>{ wordQ=e.target.value; const pos=e.target.selectionStart; render(); const n=$("#wq"); n.focus(); n.setSelectionRange(pos,pos); };
}

// ───────── sheets (word / kanji details with tabs) ─────────
let sheet=null;
function openSheet(type,key){ sheet={type,key}; renderSheet(); }
function closeSheet(){ sheet=null; const el=$("#sheet"); if(el) el.remove(); }
function kanjiIn(w){ return [...new Set([...w].filter(ch=>KANJI_BY[ch]))]; }
function kanjiMini(k){ const K=KANJI_BY[k];
  return `<div class="row" style="gap:14px"><div class="jp" style="font-size:44px;font-weight:700" data-kj="${k}">${k}</div><div style="flex:1">
    <div style="font-weight:600">${esc(K.m)}</div><div class="sub jp" style="font-size:14px">${esc(K.on)} · ${esc(K.kun)}</div>
    <div class="note" style="margin-top:4px">${esc(K.mn)}</div></div></div>`; }
function phrasesWith(test){ return PHRASES().filter(test).slice(0,4); }
function renderSheet(){
  if(!sheet) return closeSheet();
  let html="";
  if(sheet.type==="w"){
    const k=sheet.key, x=LEX[k]||{k,w:k,t:"",en:"",note:""};
    const ks=kanjiIn(x.w);
    const tabs=[["meaning","Meaning"],["sound","Sound"]].concat(ks.length?[["kanji","Kanji"]]:[]);
    let t=S.set.wTab||"meaning"; if(!tabs.some(a=>a[0]===t)) t="meaning";
    const typeLbl={w:"word",x:"expression",n:"name / place",g:"grammar"}[x.t]||"";
    let inner="";
    if(t==="meaning"){
      const ex=phrasesWith(c=>(" "+c.kana.replace(/([、。？！])/g," ")+" ").includes(" "+k+" "));
      inner=`<div style="font-size:20px;font-weight:600">${esc(x.en||"(no meaning saved)")}</div>
        ${typeLbl?`<div class="sub" style="font-size:13px">${typeLbl}</div>`:""}
        ${x.note?`<p style="margin:10px 0 0">${esc(x.note)}</p>`:""}
        ${ex.length?`<h2>In your phrases</h2>${ex.map(c=>`<div class="phrase"><div class="t"><div class="ja jp">${esc(c.ja)}</div><div class="en">${esc(c.en)}</div></div><button class="play" data-sayt="${esc(c.ja)}">▶</button></div>`).join("")}`:""}`;
    } else if(t==="sound"){
      inner=`<div class="kv"><b>Kana</b><span class="jp" style="font-size:20px">${esc(x.k)}</span><b>Romaji</b><span style="font-size:18px">${esc(romaji(x.k))}</span>${x.w!==x.k?`<b>Written</b><span class="jp" style="font-size:20px">${esc(x.w)}</span>`:""}</div>
        <div class="row" style="margin-top:14px"><button class="play" data-sayt="${esc(x.k)}">▶ Play</button><button class="play" data-sayslow="${esc(x.k)}">🐢 Slow</button></div>`;
    } else {
      inner=ks.map(ch=>`<div class="card" style="margin-bottom:8px">${kanjiMini(ch)}<button class="btn ghost sm" data-kj="${ch}" style="margin-top:8px">Open ${ch}</button></div>`).join("");
    }
    html=`<div class="jp big">${esc(x.w)}</div>${x.w!==x.k?`<div class="sub jp" style="font-size:16px">${esc(x.k)} · ${esc(romaji(x.k))}</div>`:`<div class="sub">${esc(romaji(x.k))}</div>`}
      <div class="tabs">${tabs.map(([a,l])=>`<button data-tab-w="${a}" class="${t===a?"on":""}">${l}</button>`).join("")}</div>${inner}`;
  } else {
    const K=KANJI_BY[sheet.key];
    const tabs=[["meaning","Meaning"],["sound","Readings"],["mnemonic","Mnemonic"],["words","Words"]];
    const t=S.set.kTab||"meaning";
    let inner="";
    if(t==="meaning"){
      inner=`<div style="font-size:22px;font-weight:600">${esc(K.m)}</div>
        <div class="sub" style="font-size:13px">${kLabel(K)}</div>`;
    } else if(t==="sound"){
      inner=`<div class="kv"><b>On (Chinese)</b><span class="jp" style="font-size:18px">${esc(K.on)}</span><b>Kun (Japanese)</b><span class="jp" style="font-size:18px">${esc(K.kun)}</span></div>
        <p class="note">On readings are mostly used in words made of 2+ kanji (日本 = ニホン). Kun readings are used when the kanji stands alone or has kana after it (日 = ひ, 食べる = たべる).</p>`;
    } else if(t==="mnemonic"){
      inner=`<p style="font-size:17px;margin:0">${esc(K.mn)}</p>`;
    } else {
      const more=Object.values(LEX).filter(x=>x.w.includes(K.k) && !K.ex.some(e=>e.w===x.w));
      inner=K.ex.map(e=>`<div class="phrase"><div class="t"><div class="ja jp">${esc(e.w)} <span class="sub">${esc(e.kana)}</span></div><div class="romaji" style="font-size:13px">${esc(romaji(e.kana))}</div><div class="en">${esc(e.en)}</div></div><button class="play" data-sayt="${esc(e.kana)}">▶</button></div>`).join("")
        + (COMPOUNDS.some(c=>c.w.includes(K.k)&&!K.ex.some(e=>e.w===c.w))?`<h2>Compounds</h2>`+COMPOUNDS.filter(c=>c.w.includes(K.k)&&!K.ex.some(e=>e.w===c.w)).map(c=>`<div class="phrase"><div class="t"><div class="ja jp">${esc(c.w)} <span class="sub">${esc(c.kana)}</span></div><div class="en">${esc(c.en)} · ${esc(c.why)}</div></div><button class="play" data-sayt="${esc(c.kana)}">▶</button></div>`).join(""):"")
        + (more.length?`<h2>Also in your words</h2>`+more.map(x=>`<div class="phrase" data-w="${esc(x.k)}"><div class="t"><div class="ja jp">${esc(x.w)} <span class="sub">${esc(x.k)}</span></div><div class="en">${esc(x.en)}</div></div><span class="sub">›</span></div>`).join(""):"");
    }
    html=`<div class="jp big" style="font-size:72px">${K.k}</div>
      <div class="tabs">${tabs.map(([a,l])=>`<button data-tab-k="${a}" class="${t===a?"on":""}">${l}</button>`).join("")}</div>${inner}`;
  }
  let el=$("#sheet");
  if(!el){ el=document.createElement("div"); el.id="sheet"; el.className="sheet-bg"; document.body.appendChild(el);
    el.addEventListener("click", e=>{ if(e.target===el) closeSheet(); }); }
  el.innerHTML=`<div class="sheet"><div class="grab"></div>${html}
    <button class="btn ghost" id="sheetClose" style="margin-top:16px">Close</button></div>`;
  $("#sheetClose").onclick=closeSheet;
  el.querySelectorAll("[data-tab-w]").forEach(b=>b.onclick=()=>{ S.set.wTab=b.dataset.tabW; save(); renderSheet(); });
  el.querySelectorAll("[data-tab-k]").forEach(b=>b.onclick=()=>{ S.set.kTab=b.dataset.tabK; save(); renderSheet(); });
}
// one listener for every tappable word / kanji / sound button, wherever it is
document.addEventListener("click", e=>{
  const w=e.target.closest("[data-w]"); if(w){ e.stopPropagation(); return openSheet("w", w.dataset.w); }
  const k=e.target.closest("[data-kj]"); if(k){ e.stopPropagation(); return openSheet("k", k.dataset.kj); }
  const a=e.target.closest("[data-sayt],[data-sayk]"); if(a){ e.stopPropagation(); return say(a.dataset.sayt||a.dataset.sayk); }
  const sl=e.target.closest("[data-sayslow]"); if(sl){ e.stopPropagation(); return say(sl.dataset.sayslow,true); }
}, true);

function renderAdd(){
  $("#app").innerHTML=`
    <h1>Add a card</h1>
    <p class="sub">Something you heard or couldn't say today. It joins your practice from the next session.</p>
    <div class="card" style="margin-top:14px">
      <div class="seg" id="kind"><button data-k="say" class="on">I want to say it</button><button data-k="hear">Someone said it</button></div>
      <label class="f">English meaning</label><input type="text" id="en" placeholder="e.g. Is there a locker?">
      <label class="f">Japanese</label><input type="text" id="ja" class="jp" placeholder="e.g. ロッカーはありますか。" lang="ja">
      <label class="f">Reading in kana (optional, spaces between words)</label><input type="text" id="kana" class="jp" placeholder="ロッカー は あります か。" lang="ja">
      <div class="row" style="margin-top:14px;gap:8px"><button class="btn ghost" id="test" style="flex:1">▶ Test</button><button class="btn" id="save" style="flex:2">Save card</button></div>
      ${addMsg?`<p class="note" style="color:var(--good)">${esc(addMsg)}</p>`:""}
      <p class="note">Tip: ask the person to type it on your phone, or copy it from Google Translate / a sign photo with Live Text.</p>
    </div>
    ${S.mine.length?`<h2>My cards</h2><div class="card" style="padding:4px 16px">${S.mine.map(c=>`
      <div class="phrase"><div class="t" data-say="${c.id}"><div class="ja jp">${esc(c.ja)}</div><div class="en">${esc(c.en)}</div></div>
      <button class="del" data-del="${c.id}">Delete</button></div>`).join("")}</div>`:""}`;
  let kind="say";
  document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{kind=b.dataset.k; document.querySelectorAll("[data-k]").forEach(x=>x.classList.toggle("on",x===b));});
  $("#test").onclick=()=>{ const j=$("#ja").value.trim(); if(j) say(j); };
  $("#save").onclick=()=>{
    const en=$("#en").value.trim(), ja=$("#ja").value.trim(); let kana=$("#kana").value.trim();
    if(!en||!ja){ addMsg="Fill in English and Japanese."; return renderAdd(); }
    if(!kana) kana = /^[぀-ヿ\s、。？ー]+$/.test(ja) ? ja : ja; // falls back to the Japanese as written
    S.mine.push({id:"m"+Date.now(), pack:"mine", kind, en, ja, kana});
    save(); addMsg="Saved. It'll show up in your next session."; renderAdd();
  };
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{ S.mine=S.mine.filter(c=>c.id!==b.dataset.del); delete S.p[b.dataset.del]; save(); addMsg=""; renderAdd(); });
  document.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>say(byId(b.dataset.say).ja));
}

let backupMsg="";
async function exportBackup(){
  const name="sumi-backup-"+dayKey()+".json";
  const blob=new Blob([JSON.stringify(S)],{type:"application/json"});
  try{
    const file=new File([blob],name,{type:"application/json"});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:"Sumi backup"}); backupMsg="Backup shared. Save it to Files."; return render(); }
  }catch(e){ if(e && e.name==="AbortError") return; }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove();
  backupMsg="Backup downloaded."; render();
}
function importBackup(file){
  const r=new FileReader();
  r.onload=()=>{ try{
      const d=JSON.parse(r.result);
      if(!d || typeof d.p!=="object" || !d.set) throw 0;
      if(!confirm("Replace your current progress with this backup?")) return;
      S=d; S.mine=S.mine||[]; S.log=S.log||{}; S.recent=S.recent||[]; S.mission=S.mission||{date:"",ids:[],done:[]}; S.set.packs=S.set.packs||{};
      save(); backupMsg="Backup restored."; render();
    }catch(e){ backupMsg=""; alert("That file isn't a Sumi backup."); } };
  r.readAsText(file);
}
function renderSettings(){
  const vs = "speechSynthesis" in window ? pickVoice() : [];
  $("#app").innerHTML=`
    <h1>Settings</h1>
    <div class="card">
      <label class="f" style="margin-top:0">Japanese voice</label>
      ${vs.length?`<select id="voice">${vs.map(v=>`<option ${voice&&v.name===voice.name?"selected":""}>${esc(v.name)}</option>`).join("")}</select>
        <p class="note">For a better voice: iPhone Settings → Accessibility → Spoken Content → Voices → Japanese → download an "Enhanced" voice. Then pick it here.</p>`
      :`<p class="note">No Japanese voice found. On iPhone: Settings → Accessibility → Spoken Content → Voices → Japanese, and download one.</p>`}
      <label class="f">Speaking speed: <b id="rv">${S.set.rate.toFixed(2)}</b></label>
      <input type="range" id="rate" min="0.5" max="1.2" step="0.05" value="${S.set.rate}" style="width:100%">
      <button class="btn ghost" id="test" style="margin-top:10px">▶ Test: 今何時ですか。</button>
    </div>
    <div class="card" style="margin-top:12px;padding:6px 18px">
      <div class="pack"><div style="flex:1">Show romaji</div><button class="toggle ${S.set.romaji?"on":""}" id="ro"></button></div>
      <div class="pack"><div style="flex:1">Show kanji (with kana below)</div><button class="toggle ${S.set.kanji?"on":""}" id="kj"></button></div>
      <div class="pack"><div style="flex:1">Cards per session</div>
        <select id="per" style="width:auto">${[10,15,20,30].map(n=>`<option ${S.set.perSession===n?"selected":""}>${n}</option>`).join("")}</select></div>
    </div>
    <div class="card" style="margin-top:12px">
      <p class="sub" style="margin-top:0">Your progress lives only on this phone, inside this home-screen app.</p>
      <div class="row" style="gap:8px;margin-top:10px"><button class="btn ghost" id="exp" style="flex:1">Export backup</button><button class="btn ghost" id="imp" style="flex:1">Import backup</button></div>
      <input type="file" id="impf" accept="application/json,.json" class="hidden">
      ${backupMsg?`<p class="note" style="color:var(--good)">${esc(backupMsg)}</p>`:""}
      <button class="btn ghost" id="reset" style="margin-top:10px;color:var(--bad)">Reset all progress</button>
    </div>
    <p class="note center">Sumi · works offline</p>`;
  if($("#voice")) $("#voice").onchange=e=>{ S.set.voice=e.target.value; save(); pickVoice(); };
  $("#rate").oninput=e=>{ S.set.rate=+e.target.value; $("#rv").textContent=S.set.rate.toFixed(2); save(); };
  $("#test").onclick=()=>say("今何時ですか。");
  $("#ro").onclick=()=>{ S.set.romaji=!S.set.romaji; save(); render(); };
  $("#kj").onclick=()=>{ S.set.kanji=!S.set.kanji; save(); render(); };
  $("#per").onchange=e=>{ S.set.perSession=+e.target.value; save(); };
  $("#exp").onclick=exportBackup;
  $("#imp").onclick=()=>$("#impf").click();
  $("#impf").onchange=e=>{ const f=e.target.files[0]; if(f) importBackup(f); };
  $("#reset").onclick=()=>{ if(confirm("Reset all progress? Your own cards stay.")){ S.p={}; S.kq={}; S.log={}; S.recent=[]; S.mission={date:"",ids:[],done:[]}; save(); render(); } };
}

document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{ tab=b.dataset.tab; addMsg=""; render(); });
render();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
